<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numberle - Atardecer Mágico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(180deg, #f5d6a8 0%, #ffe4c9 35%, #e0f7fa 60%, #a7c7e7 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #2c3e50, #e87360);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.8);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            max-width: 900px;
            width: 100%;
            margin-bottom: 40px;
        }

        .status-bar {
            background: #e86e54;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            min-width: 200px;
        }

        .attempts-info {
            color: #555;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 30px;
        }

        .board {
            display: grid;
            grid-template-rows: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .tile {
            width: 60px;
            height: 60px;
            background: white;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            transition: all 0.3s ease;
            position: relative;
        }

        .tile:hover {
            background: #f8f9fa;
        }

        .tile:focus {
            outline: none;
            border-color: #e86e54;
        }

        .tile.green {
            background: #27ae60;
            color: white;
            border-color: #27ae60;
            box-shadow: 0 0 10px rgba(39, 174, 96, 0.5);
        }

        .tile.yellow {
            background: #f39c12;
            color: #2c3e50;
            border-color: #f39c12;
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
        }

        .tile.gray {
            background: #95a5a6;
            color: white;
            border-color: #95a5a6;
        }

        .keyboard-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            margin: 20px 0;
        }

        .key {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            background: #e0f7fa;
            color: #2c3e50;
            transition: all 0.2s;
        }

        .key:hover:not(.used):not(.correct):not(.present):not(.wrong) {
            background: #b2e3e8;
        }

        .key.used {
            pointer-events: none;
            opacity: 0.7;
        }

        .key.correct {
            background: #27ae60;
            color: white;
        }

        .key.present {
            background: #f39c12;
            color: #2c3e50;
        }

        .key.wrong {
            background: #95a5a6;
            color: white;
        }

        .keyboard-container .key:last-child {
            grid-column: span 2;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #e86e54;
            color: white;
        }

        .btn-primary:hover {
            background: #e05746;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            min-width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .play-again {
            padding: 12px 25px;
            background: #e86e54;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
        }

        .play-again:hover {
            background: #e05746;
        }

        @media (max-width: 480px) {
            .tile {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
            .key {
                width: 40px;
                height: 40px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <h1>Numberle - Atardecer Mágico</h1>
    <div class="subtitle" id="subtitle">Adivina el número de 4 dígitos</div>

    <div class="game-container">
        <div class="status-bar" id="statusBar">Intento 1/5</div>
        <div class="attempts-info" id="attemptsInfo">Escribe un número de 4 dígitos</div>

        <div class="board" id="board">
            <!-- 5 filas de 4 cajas cada una -->
        </div>

        <div class="keyboard-container" id="keyboardContainer">
            <button class="key" data-key="1">1</button>
            <button class="key" data-key="2">2</button>
            <button class="key" data-key="3">3</button>
            <button class="key" data-key="4">4</button>
            <button class="key" data-key="5">5</button>
            <button class="key" data-key="6">6</button>
            <button class="key" data-key="7">7</button>
            <button class="key" data-key="8">8</button>
            <button class="key" data-key="9">9</button>
            <button class="key" data-key="0">0</button>
            <button class="key" data-key="del">←</button>
            <button class="key" data-key="enter">↵</button>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="newGameBtn">Jugar de nuevo</button>
        </div>
    </div>

    <!-- Modal de resultado -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 id="resultTitle">¡Resultado!</h2>
            <p id="resultMessage"></p>
            <button class="play-again" id="playAgainBtn">Jugar otra vez</button>
        </div>
    </div>

    <script>
        // Configuración
        const NUM_DIGITS = 4; // 4 dígitos
        const MAX_ATTEMPTS = 5; // 5 intentos
        let currentAttempt = 0;
        let gameOver = false;
        let usedKeys = new Set();
        let totalGames = 0;
        let gamesWon = 0;

        // Elementos DOM
        const board = document.getElementById('board');
        const statusBar = document.getElementById('statusBar');
        const attemptsInfo = document.getElementById('attemptsInfo');
        const keyboardContainer = document.getElementById('keyboardContainer');
        const newGameBtn = document.getElementById('newGameBtn');
        const resultModal = document.getElementById('resultModal');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');
        const playAgainBtn = document.getElementById('playAgainBtn');

        // Generar número secreto de N dígitos (sin repetir para simplicidad)
        function generateSecretNumber() {
            const digits = '0123456789';
            let result = '';
            const shuffled = digits.split('').sort(() => 0.5 - Math.random());
            for (let i = 0; i < NUM_DIGITS; i++) {
                result += shuffled[i];
            }
            return result;
        }

        // Evaluar el intento
        function evaluateAttempt(attempt) {
            const result = [];
            const secretArr = secretNumber.split('');
            const attemptArr = attempt.split('');

            // Primero: marcar verdes
            for (let i = 0; i < NUM_DIGITS; i++) {
                if (attemptArr[i] === secretArr[i]) {
                    result.push('green');
                    secretArr[i] = null; // Marcar como usado
                } else {
                    result.push(null); // Temporalmente null, se rellenará después
                }
            }

            // Segundo:amarillos (número en el secreto pero posición incorrecta)
            for (let i = 0; i < NUM_DIGITS; i++) {
                if (result[i] === 'green') continue; // Ya procesado

                const digitIndex = secretArr.indexOf(attemptArr[i]);
                if (digitIndex !== -1) {
                    result[i] = 'yellow';
                    secretArr[digitIndex] = null; // Marcar como usado para evitar duplicados
                } else {
                    result[i] = 'gray';
                }
            }

            return result;
        }

        // Crear tablero con exactamente MAX_ATTEMPTS filas
        function createBoard() {
            board.innerHTML = '';
            // Crear 5 filas con 4 cajas cada una
            for (let i = 0; i < MAX_ATTEMPTS; i++) {
                const row = document.createElement('div');
                row.className = 'row';
                for (let j = 0; j < NUM_DIGITS; j++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.contentEditable = 'false';
                    tile.tabIndex = -1;
                    row.appendChild(tile);
                }
                board.appendChild(row);
            }
        }

        // Crear teclado
        function createKeyboard() {
            keyboardContainer.innerHTML = '';
            const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', 'del', 'enter'];
            keys.forEach(key => {
                const button = document.createElement('button');
                button.className = 'key';
                button.dataset.key = key;
                button.textContent = key === 'del' ? '←' : key === 'enter' ? '↵' : key;
                button.addEventListener('click', () => handleKeyPress(key));
                keyboardContainer.appendChild(button);
            });
        }

        // Manejar presión de tecla (corregido para llenar de izquierda a derecha)
        function handleKeyPress(key) {
            if (gameOver) return;

            const rows = board.children;
            const tileRow = rows[currentAttempt].children;

            if (key === 'del') {
                // Borrar último dígito: encontrar el último tile lleno de izquierda a derecha
                for (let i = tileRow.length - 1; i >= 0; i--) {
                    if (tileRow[i].textContent !== '') {
                        tileRow[i].textContent = '';
                        tileRow[i].className = 'tile';
                        break;
                    }
                }
            } else if (key === 'enter') {
                // Intentar enviar
                const attempt = Array.from(tileRow).map(t => t.textContent).join('');
                if (attempt.length === NUM_DIGITS) {
                    processAttempt(attempt);
                }
            } else if (/[0-9]/.test(key)) {
                // Agregar dígito: buscar el primer tile vacío de izquierda a derecha
                for (let i = 0; i < tileRow.length; i++) {
                    if (tileRow[i].textContent === '') {
                        tileRow[i].textContent = key;
                        tileRow[i].className = 'tile';
                        break;
                    }
                }
            }
        }

        // Procesar intento
        function processAttempt(attempt) {
            if (gameOver) return;

            const result = evaluateAttempt(attempt);

            // Aplicar colores al tablero actual
            const tileRow = board.children[currentAttempt].children;

            result.forEach((color, index) => {
                const tile = tileRow[index];
                tile.textContent = attempt[index];
                if (color === 'green') {
                    tile.className = 'tile green';
                } else if (color === 'yellow') {
                    tile.className = 'tile yellow';
                } else {
                    tile.className = 'tile gray';
                }
                tile.style.color = 'white';
            });

            // Actualizar teclado
            updateKeyboard(result, attempt);

            // Verificar si ganó
            if (result.every(c => c === 'green')) {
                gameOver = true;
                totalGames++;
                gamesWon++;
                updateStats();
                showResult('¡Ganaste!', `Adivinaste el número ${secretNumber}`, 'success');
                // Auto-start new game after 2 seconds
                setTimeout(startNewGame, 2000);
            } else if (currentAttempt >= MAX_ATTEMPTS - 1) {
                // Se acabaron los 5 intentos
                gameOver = true;
                totalGames++;
                showResult('Se acabaron los intentos', `El número era ${secretNumber}`, 'failure');
                setTimeout(startNewGame, 2000);
            } else {
                statusBar.textContent = `Intento ${currentAttempt + 1}/${MAX_ATTEMPTS}`;
                // Permitir siguiente intento
                currentAttempt++;
            }
        }

        // Actualizar teclado
        function updateKeyboard(result, attempt) {
            result.forEach((color, index) => {
                const keyChar = attempt[index];
                const key = keyboardContainer.querySelector(`.key[data-key="${keyChar}"]`);
                if (key) {
                    key.classList.remove('correct', 'present', 'wrong');
                    if (color === 'green') {
                        key.classList.add('correct');
                        usedKeys.add(keyChar);
                    } else if (color === 'yellow') {
                        key.classList.add('present');
                    } else {
                        key.classList.add('wrong');
                    }
                }
            });
        }

        // Iniciar nuevo juego automáticamente
        function startNewGame() {
            secretNumber = generateSecretNumber();
            currentAttempt = 0;
            gameOver = false;
            usedKeys.clear();
            updateStats();
            
            // Limpiar tablero
            const rows = board.children;
            for (let i = 0; i < rows.length; i++) {
                const tiles = rows[i].children;
                for (let j = 0; j < tiles.length; j++) {
                    tiles[j].textContent = '';
                    tiles[j].className = 'tile';
                    tiles[j].style.color = '';
                }
            }
            
            statusBar.textContent = `Intento 1`;
            attemptsInfo.textContent = `Adivina el número de ${NUM_DIGITS} dígitos`;
            resultModal.style.display = 'none';
            
            // Habilitar teclado
            const keys = keyboardContainer.querySelectorAll('.key');
            keys.forEach(key => {
                key.classList.remove('correct', 'present', 'wrong');
                key.style.pointerEvents = 'auto';
            });
        }

        // Actualizar estadísticas
        function updateStats() {
            attemptsInfo.textContent = `Juegos: ${totalGames} | Ganados: ${gamesWon}`;
        }

        // Mostrar modal de resultado
        function showResult(title, message, type) {
            resultTitle.textContent = title;
            resultMessage.textContent = message;
            resultModal.style.display = 'flex';
        }

        // Event listeners
        newGameBtn.addEventListener('click', startNewGame);
        playAgainBtn.addEventListener('click', startNewGame);

        // Inicializar juego
        createBoard();
        createKeyboard();
        startNewGame();
    </script>

</body>
</html>
